name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Preflight runs the same checks the CI workflow runs on every push to
  # main, but here it gates the release pipeline. The release job (and
  # everything that depends on it) won't run if the tagged sha can't pass
  # gofmt, vet, race-tests, or the VSCode build/test. This closes the
  # gap that let v4.7.0 publish despite a gofmt failure on main.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format check
        run: |
          output=$(gofmt -l .)
          if [ -n "$output" ]; then
            echo "Files not formatted:"
            echo "$output"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: VSCode lint + typecheck + tests
        working-directory: vscode-extension
        run: |
          npm ci
          npx eslint .
          npx tsc --noEmit
          npx vitest run

  release:
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate release notes with git-cliff
        id: notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: ${{ runner.temp }}/RELEASE_NOTES.md

      - name: Preview release notes
        run: cat "${{ steps.notes.outputs.changelog }}"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --release-notes=${{ steps.notes.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  verify-go-install:
    # Confirms `go install github.com/.../ezstack/v4/cmd/ezs@<tag>` resolves
    # and builds. If the module path ever drifts from the major version in
    # the tag, this job fails fast and the release is caught before users
    # hit the broken install command.
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: go install tagged version
        env:
          GOPROXY: direct
          GOSUMDB: "off"
        run: |
          set -euxo pipefail
          scratch="$(mktemp -d)"
          cd "$scratch"
          GOBIN="$scratch/bin" go install \
            github.com/KulkarniKaustubh/ezstack/v4/cmd/ezs@${{ github.ref_name }}
          GOBIN="$scratch/bin" go install \
            github.com/KulkarniKaustubh/ezstack/v4/cmd/ezs-mcp@${{ github.ref_name }}
          "$scratch/bin/ezs" --version
          # ezs-mcp speaks JSON-RPC over stdio and has no --version flag; a
          # successful `go install` plus an executable binary is enough to
          # confirm the release is installable.
          test -x "$scratch/bin/ezs-mcp"

  vsix:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build VSIX
        working-directory: vscode-extension
        run: |
          npm ci
          npm run compile
          npx vsce package

      - name: Upload VSIX to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" vscode-extension/ezstack-*.vsix --clobber

  nvim:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Package Neovim plugin
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # neovim-plugin/ is a submodule pointing at KulkarniKaustubh/ezstack.nvim.
          # Stage as ezstack-nvim/ so users get a clean top-level dir on extract.
          mkdir -p dist
          rsync -a --exclude '.git' neovim-plugin/ "ezstack-nvim/"
          tar czf "dist/ezstack-nvim-${VERSION}.tar.gz" ezstack-nvim
          (cd ezstack-nvim/.. && zip -qr "dist/ezstack-nvim-${VERSION}.zip" ezstack-nvim)

      - name: Upload Neovim plugin to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" dist/ezstack-nvim-*.tar.gz dist/ezstack-nvim-*.zip --clobber

  desktop:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-ui/src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tauri-ui/package-lock.json

      - name: Install frontend deps
        working-directory: tauri-ui
        run: npm ci

      - name: Build & upload desktop bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tauri-ui
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish:
    runs-on: ubuntu-latest
    needs: [release, verify-go-install, vsix, nvim, desktop]
    steps:
      - uses: actions/checkout@v4

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" --draft=false

  bump-version:
    runs-on: ubuntu-latest
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Bump version references
        run: |
          # Strip leading 'v' from tag
          VERSION="${GITHUB_REF_NAME#v}"
          # The script writes the list of files it touched to $BUMP_FILES_OUT
          # so the "Commit and push" step below can stage exactly that set.
          # Keeping a single source of truth prevents the two lists from
          # drifting (previous bug: tauri-ui/src/version.ts was bumped but
          # never committed, leaving the desktop title bar stale on main).
          export BUMP_FILES_OUT="$RUNNER_TEMP/bump-files.txt"
          ./scripts/bump-version.sh "$VERSION"
          echo "BUMP_FILES_OUT=$BUMP_FILES_OUT" >> "$GITHUB_ENV"

      - name: Regenerate docs from source
        run: make docs

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="${GITHUB_REF_NAME#v}"
          if [ ! -s "$BUMP_FILES_OUT" ]; then
            echo "::error::bump-version.sh produced no file list at $BUMP_FILES_OUT"
            exit 1
          fi
          # Read the list into an array via `while read` — portable across
          # bash 3.2 (macOS default) and bash 5 (Linux runners). `xargs -a`
          # / `-d` and `mapfile` aren't both available everywhere. The `--`
          # stops `git add` interpreting any leading-dash path as a flag.
          files=()
          while IFS= read -r line; do
            [ -n "$line" ] && files+=("$line")
          done < "$BUMP_FILES_OUT"
          git add -- "${files[@]}"
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "bump version references to v${VERSION}"
          git push
