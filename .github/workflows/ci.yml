name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format check
        run: |
          output=$(gofmt -l .)
          if [ -n "$output" ]; then
            echo "Files not formatted:"
            echo "$output"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -race ./...

  go-install:
    # Verifies `go install github.com/.../ezstack/v4/cmd/ezs@<sha>` works
    # against the module proxy. This catches SIV mistakes (e.g. bumping to
    # a new major without updating the module path / import paths) that
    # local `go build` can't see because it uses go.mod verbatim.
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: go
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: go install from scratch dir
        env:
          GOPROXY: direct
          GOSUMDB: "off"
        run: |
          set -euxo pipefail
          scratch="$(mktemp -d)"
          cd "$scratch"
          GOBIN="$scratch/bin" go install \
            github.com/KulkarniKaustubh/ezstack/v4/cmd/ezs@${{ github.sha }}
          GOBIN="$scratch/bin" go install \
            github.com/KulkarniKaustubh/ezstack/v4/cmd/ezs-mcp@${{ github.sha }}
          "$scratch/bin/ezs" --version
          test -x "$scratch/bin/ezs-mcp"

  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Lint
        working-directory: vscode-extension
        run: npx eslint .

      - name: Type check
        working-directory: vscode-extension
        run: npx tsc --noEmit

      - name: Test
        working-directory: vscode-extension
        run: npx vitest run
